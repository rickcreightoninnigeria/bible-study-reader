name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # package.json and the vitest config live in testing/, not the repo root.
    defaults:
      run:
        working-directory: testing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: testing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
