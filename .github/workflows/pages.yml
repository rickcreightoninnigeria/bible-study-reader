name: Deploy web build

# Publishes the web version (app/ plus a generated service worker) to GitHub
# Pages. One-time setup: repository Settings → Pages → Source: "GitHub Actions".
# The site is served from https://<owner>.github.io/<repo>/, so everything in
# the app uses relative paths.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'py/build_web.py'
      - 'PRIVACY_POLICY.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Do not publish a build that fails its own tests.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: testing/package-lock.json
      - name: Run tests
        working-directory: testing
        run: |
          npm ci
          npm test

      - name: Build the web version
        run: python3 py/build_web.py --out dist/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
